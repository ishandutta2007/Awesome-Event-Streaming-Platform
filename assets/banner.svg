<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <style>
      .pulse-line {
        stroke-dasharray: 20, 10;
        animation: dash 30s linear infinite;
      }
      .node-pulse {
        animation: pulse 3s ease-in-out infinite alternate;
      }
      @keyframes dash {
        to {
          stroke-dashoffset: -1000;
        }
      }
      @keyframes pulse {
        0% { r: 6px; opacity: 0.6; }
        100% { r: 10px; opacity: 1; filter: drop-shadow(0 0 8px #38bdf8); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" />

  <!-- Dynamic Event Streaming Data Flow Lines (Background Dynamic Element) -->
  <g opacity="0.25">
    <!-- Stream 1 -->
    <path d="M -50,60 Q 300,160 600,80 T 1250,140" fill="none" stroke="#38bdf8" stroke-width="3" class="pulse-line" />
    <!-- Stream 2 -->
    <path d="M -50,260 Q 400,100 800,240 T 1250,180" fill="none" stroke="#818cf8" stroke-width="2" class="pulse-line" />
    <!-- Stream 3 -->
    <path d="M -50,180 Q 200,280 700,150 T 1250,60" fill="none" stroke="#c084fc" stroke-width="2.5" class="pulse-line" />
  </g>

  <!-- Glowing Stream Nodes (Background Dynamic Elements) -->
  <g opacity="0.4">
    <circle cx="200" cy="110" r="8" fill="#38bdf8" class="node-pulse" />
    <circle cx="450" cy="220" r="8" fill="#818cf8" class="node-pulse" style="animation-delay: 1s;" />
    <circle cx="750" cy="130" r="8" fill="#c084fc" class="node-pulse" style="animation-delay: 2s;" />
    <circle cx="1000" cy="190" r="8" fill="#38bdf8" class="node-pulse" style="animation-delay: 1.5s;" />
  </g>

  <!-- Foreground Main Card Container for Title and Subtitle -->
  <rect x="100" y="40" width="1000" height="240" rx="16" fill="#0f172a" fill-opacity="0.75" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5" filter="url(#glow)" />

  <!-- Main Title -->
  <text x="600" y="125" text-anchor="middle" fill="url(#titleGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="1">
    AWESOME EVENT STREAMING PLATFORMS
  </text>

  <!-- Subtitle -->
  <text x="600" y="175" text-anchor="middle" fill="#f1f5f9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing="0.5">
    ⚡ Complete Ecosystem of Real-Time Event Streaming, Kafka Brokers, Pub/Sub &amp; Stream Processing
  </text>

  <!-- Pill Highlights in Foreground -->
  <g transform="translate(600, 225)">
    <!-- Pill 1 -->
    <g transform="translate(-240, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0284c7" fill-opacity="0.6" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#e0f2fe" font-family="sans-serif" font-size="13" font-weight="600">🚀 SaaS &amp; Cloud</text>
    </g>
    <!-- Pill 2 -->
    <g transform="translate(0, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#4f46e5" fill-opacity="0.6" stroke="#818cf8" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#e0e7ff" font-family="sans-serif" font-size="13" font-weight="600">⭐ Open Source</text>
    </g>
    <!-- Pill 3 -->
    <g transform="translate(240, 0)">
      <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#7e22ce" fill-opacity="0.6" stroke="#c084fc" stroke-width="1" />
      <text x="0" y="5" text-anchor="middle" fill="#fae8ff" font-family="sans-serif" font-size="13" font-weight="600">📊 Market Insights</text>
    </g>
  </g>
</svg>
