<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 320"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0284c7"/></linearGradient><linearGradient id="titleGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="6"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter><style>@keyframes pulse{0%{r:6px;opacity:.6}}.pulse-line{stroke-dasharray:20,10;animation:dash 30s linear infinite}.node-pulse{animation:pulse 3s ease-in-out infinite alternate}</style></defs><rect width="1200" height="320" fill="url(#bgGrad)" rx="16"/><g opacity=".25"><path fill="none" stroke="#38bdf8" stroke-width="3" d="M -50,60 Q 300,160 600,80 T 1250,140" class="pulse-line"/><path fill="none" stroke="#818cf8" stroke-width="2" d="M -50,260 Q 400,100 800,240 T 1250,180" class="pulse-line"/><path fill="none" stroke="#c084fc" stroke-width="2.5" d="M -50,180 Q 200,280 700,150 T 1250,60" class="pulse-line"/></g><g opacity=".4"><circle cx="200" cy="110" r="8" fill="#38bdf8" class="node-pulse"/><circle cx="450" cy="220" r="8" fill="#818cf8" class="node-pulse" style="animation-delay:1s"/><circle cx="750" cy="130" r="8" fill="#c084fc" class="node-pulse" style="animation-delay:2s"/><circle cx="1000" cy="190" r="8" fill="#38bdf8" class="node-pulse" style="animation-delay:1.5s"/></g><rect width="1000" height="240" x="100" y="40" fill="#0f172a" fill-opacity=".75" stroke="#38bdf8" stroke-opacity=".4" stroke-width="1.5" filter="url(#glow)" rx="16"/><text x="600" y="125" fill="url(#titleGrad)" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" letter-spacing="1" text-anchor="middle">AWESOME EVENT STREAMING PLATFORMS</text><text x="600" y="175" fill="#f1f5f9" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500" letter-spacing=".5" text-anchor="middle">⚡ Complete Ecosystem of Real-Time Event Streaming, Kafka Brokers, Pub/Sub &amp; Stream Processing</text><g><g transform="translate(600, 225) translate(-240, 0)"><rect width="160" height="32" x="-80" y="-16" fill="#0284c7" fill-opacity=".6" stroke="#38bdf8" stroke-width="1" rx="16"/><text x="0" y="5" fill="#e0f2fe" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 SaaS &amp; Cloud</text></g><g transform="translate(600, 225) translate(0, 0)"><rect width="160" height="32" x="-80" y="-16" fill="#4f46e5" fill-opacity=".6" stroke="#818cf8" stroke-width="1" rx="16"/><text x="0" y="5" fill="#e0e7ff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">⭐ Open Source</text></g><g transform="translate(600, 225) translate(240, 0)"><rect width="160" height="32" x="-80" y="-16" fill="#7e22ce" fill-opacity=".6" stroke="#c084fc" stroke-width="1" rx="16"/><text x="0" y="5" fill="#fae8ff" font-family="sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 Market Insights</text></g></g></svg>